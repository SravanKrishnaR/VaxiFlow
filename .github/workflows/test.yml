name: VaxiFlow CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-pipeline:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v1
        with:
          version: latest-stable

      - name: Install system tools required by Nextflow
        run: |
          apt-get update
          apt-get install -y procps coreutils

      - name: Enable Conda in Nextflow
        run: |
          echo "conda.enabled = true" >> nextflow.config

      - name: Install Docker CLI
        run: |
          apt-get update
          apt-get install -y docker.io

      - name: Run VaxiFlow test pipeline
        run: |
          nextflow run main.nf \
            -profile test_proteome \
            --mode unfiltered \
            -with-report test_report.html \
            -with-trace test_trace.txt

      - name: Upload test report
        uses: actions/upload-artifact@v4
        with:
          name: nextflow-report
          path: test_report.html

